# Tests plus receipt and employer-data gates. Actions are SHA-pinned to the
# same commits as the other Jott2121 repos (checkout v4.3.1, setup-python v5).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint CI tooling
        # quorumcal/ and tests/ are not ruff-clean. Formatting them would
        # rewrite library code, which this workflow does not do. Gate the
        # scripts CI itself runs.
        run: ruff check scripts && ruff format --check scripts
      - name: Test
        run: python -m pytest -q --cov=quorumcal --cov-report=term-missing --cov-fail-under=90

  receipts:
    # Recompute every published headline number from the committed report.
    # Does not call judge CLIs and does not rebuild from the filtered goldset.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package
        # The checker imports quorumcal (Wilson bound, prompt fingerprint).
        # No judge CLIs and no dev tools.
        run: python -m pip install -e .
      - name: Check published numbers against runs/phase2c/report.json
        run: python scripts/check_receipts.py

  no-employer-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The author bio ("AI Foundations Lead at Lockheed Martin") is ignored
      # as a single sentence. README stays in the scan. See the script.
      - name: Block employer / export-control markers and committed build junk
        run: python scripts/check_no_employer_data.py
