[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quorumcal"
version = "0.1.0"
description = "Empirical calibrator for LLM judge panels (effective votes, quorum budgets)"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["quorumcal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
